[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcs-model"
version = "0.6.1"
description = "Modele de Coherence Systemique - Indice de Marge Systemique M(t), dette invisible et pre-rupture"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Didier Daloze", email = "dalozedidier@gmail.com" }]
keywords = ["systems", "resilience", "viability", "simulation", "early-warning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.0", "build>=1.2", "twine>=5.0"]
app = ["streamlit>=1.30", "pandas>=2.0"]
protocol = ["pyyaml>=6.0"]
viz = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["mcs"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
