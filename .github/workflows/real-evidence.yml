name: Real empirical evidence
on:
  workflow_dispatch:
    inputs:
      dataset:
        type: choice
        required: true
        options: [all, metropt3, hydraulic, ims_bearings_1st_test, ims_bearings_2nd_test, ims_bearings_3rd_test]
permissions:
  contents: read
jobs:
  empirical:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e '.[real,viz]'
      - name: Install IMS extraction support
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Select datasets
        id: select
        shell: bash
        run: |
          if [[ '${{ inputs.dataset }}' == 'all' ]]; then
            echo 'datasets=metropt3 hydraulic ims_bearings_1st_test ims_bearings_2nd_test ims_bearings_3rd_test' >> "$GITHUB_OUTPUT"
          else
            echo 'datasets=${{ inputs.dataset }}' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch, verify and evaluate official sources
        id: empirical_run
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p reports/real
          fetched=''
          failures=0
          : > reports/real/workflow-status.tsv
          for DATASET in ${{ steps.select.outputs.datasets }}; do
            BASE="$DATASET"
            if [[ "$BASE" == ims_bearings_* ]]; then BASE=ims_bearings; fi
            if [[ " $fetched " != *" $BASE "* ]]; then
              if ! python scripts/fetch_real_data.py "$BASE"; then
                printf '%s\tfetch_failed\n' "$DATASET" >> reports/real/workflow-status.tsv
                failures=$((failures + 1))
                continue
              fi
              if ! python scripts/verify_real_data.py "data/real/$BASE"; then
                printf '%s\tverification_failed\n' "$DATASET" >> reports/real/workflow-status.tsv
                failures=$((failures + 1))
                continue
              fi
              fetched="$fetched $BASE"
            fi
            if python scripts/run_real_evidence.py "$DATASET"; then
              printf '%s\tok\n' "$DATASET" >> reports/real/workflow-status.tsv
            else
              printf '%s\tevaluation_failed\n' "$DATASET" >> reports/real/workflow-status.tsv
              failures=$((failures + 1))
            fi
          done
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Refresh readiness after download and extraction
        if: always()
        run: python scripts/audit_real_readiness.py
      - name: Build cumulative empirical site payload
        if: always()
        run: python scripts/build_real_evidence_site.py --preserve-existing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-evidence-${{ inputs.dataset }}
          path: |
            reports/real/
            docs/data/real-evidence.json
      - name: Empirical workflow summary
        if: always()
        run: |
          echo "### Empirical run status" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f reports/real/workflow-status.tsv ]]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat reports/real/workflow-status.tsv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Failures: ${{ steps.empirical_run.outputs.failures }}" >> "$GITHUB_STEP_SUMMARY"

