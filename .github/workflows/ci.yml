name: Quality gates

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,viz,protocol]"
      - run: ruff check .
      - run: mypy src/mcs
      - run: pytest --cov=mcs --cov-report=term-missing --cov-report=json:reports/coverage.json --junitxml=reports/junit.xml
      - run: pytest tests/test_js_parity.py -q
      - run: python scripts/run_robustness.py
      - run: python scripts/run_protocol_demo.py
      - run: python scripts/run_demo_dossier.py
      - run: python scripts/run_benchmark.py
      - run: python scripts/build_site_data.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
