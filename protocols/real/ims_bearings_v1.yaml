protocol_id: ims_bearings_mcs_v1
status: implementation_frozen_v1
source:
  dataset: NASA IMS Bearings
  nature: real_physical_run_to_failure_experiment
split:
  method: leave_one_bearing_or_run_out
external_outcome:
  source: observed_run_termination_and_failure_documentation
proxies:
  status: hypotheses_to_freeze_before_evaluation
  L: vibration_energy_and_load_indicators
  R: return_toward_healthy_baseline_between_acquisitions
  B: cross_channel_consistency_and_trend_feedback
warning: >-
  Failure timing and bearing identity must be taken from the official experiment metadata,
  never inferred from M itself.


evaluation_rules:
  split: chronological_only
  proxy_scaling: calibration_segment_only
  target_false_alarm_rate: 0.05
  threshold_selection: calibration_non_event_quantile
  confirmation_steps: 2
  event_matching: one_alarm_maximum_per_external_event
  negative_control: circular_shift_of_external_event_windows
  missing_data: no_label_or_observation_fabrication
publication_rules:
  publish_failures: true
  publish_negative_controls: true
  publish_source_sha256: true
  publish_protocol_sha256: true
  universal_validation_claim: forbidden
