protocol_id: hydraulic_mcs_v1
status: implementation_frozen_v1
source:
  dataset: Condition monitoring of hydraulic systems
  doi: 10.24432/C5CW21
  nature: real_physical_test_rig
split:
  method: blocked_chronological
external_outcomes:
  source: profile.txt
  cooler_condition: [3, 20, 100]
  valve_condition: [73, 80, 90, 100]
  pump_leakage: [0, 1, 2]
  accumulator_pressure: [90, 100, 115, 130]
proxies:
  status: hypotheses_to_freeze_before_evaluation
  L: electrical_power_and_pressure_demand
  R: thermal_and_pressure_recovery_within_cycle
  B: sensor_consistency_and_stable_flag
warning: >-
  Component labels are external outcomes. Proxy rules must be frozen before the held-out
  block is evaluated.


evaluation_rules:
  split: chronological_only
  proxy_scaling: calibration_segment_only
  target_false_alarm_rate: 0.05
  threshold_selection: calibration_non_event_quantile
  confirmation_steps: 2
  event_matching: one_alarm_maximum_per_external_event
  negative_control: circular_shift_of_external_event_windows
  missing_data: no_label_or_observation_fabrication
publication_rules:
  publish_failures: true
  publish_negative_controls: true
  publish_source_sha256: true
  publish_protocol_sha256: true
  universal_validation_claim: forbidden
